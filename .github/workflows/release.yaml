name: release

# Publishes the per-OS, per-arch binaries that piped downloads via the `url`
# field in its plugin config. Runs on a pushed version tag (`git tag v0.1.0 &&
# git push --tags`), or manually via workflow_dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build binaries
        run: |
          set -eu
          mkdir -p .artifacts
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -ldflags "-s -w" -trimpath \
              -o ".artifacts/plugin_kafka_${VERSION}_${os}_${arch}" .
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "kafka $VERSION" \
            --generate-notes \
            .artifacts/*
